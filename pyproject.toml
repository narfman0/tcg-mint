[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tcg-mint"
version = "0.1.0"
description = "Render trading cards from Scryfall data into your own print-resolution frame"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "narfman0" }]
requires-python = ">=3.10"
dependencies = [
  "playwright>=1.40",
  "pillow>=10",
  "tomli>=2; python_version < '3.11'",
]

[project.optional-dependencies]
fonts = ["fonttools>=4.40"]
dev = ["pytest>=8", "ruff>=0.5"]
web = ["fastapi>=0.110", "uvicorn>=0.27"]

[project.scripts]
mint = "mint.__main__:main"

[project.urls]
Repository = "https://github.com/narfman0/tcg-mint"

[tool.setuptools]
packages = ["mint"]

[tool.setuptools.package-data]
mint = ["*.html", "web/static/*"]

[tool.ruff]
line-length = 130
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E731", "B905"]  # named lambdas and plain zip() are used deliberately

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["render: needs a Playwright Chromium"]
