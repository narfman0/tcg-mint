<!doctype html>
<meta charset="utf-8">
<style>
/* The card back. Same page as the front: 1 CSS px = 1/100 in, 272x372 with bleed.
   Every colour comes from the set's Back block (sets.py); back.py derives the trim from its
   two palettes, so a back in another colour does not keep this one's warm brown rings. */
$local_fonts
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 272px; height: 372px; background: #000; overflow: hidden; }
.card { position: absolute; left: 11px; top: 11px; width: 250px; height: 350px; border-radius: 9px; overflow: hidden;
  background: #000; }  /* pure black, as on the front: one ink, continuous with the bleed */
/* the parchment field: the paper palette with grain and a darker vignette toward the edges */
.field { position: absolute; left: 9px; top: 9px; right: 9px; bottom: 9px; border-radius: 5px;
  background:
    url("$noise"),
    radial-gradient(ellipse at 50% 45%, $paper0 0%, $paper1 45%, $paper2 85%, $paper3 100%);
  box-shadow: inset 0 0 0 1.2px rgba(0,0,0,.6), inset 0 0 0 2.4px $highlight22, inset 0 0 18px rgba(0,0,0,.45); }
.field::after { /* thin inner rule, like the printed back's pinstripe */
  content: ""; position: absolute; left: 6px; top: 6px; right: 6px; bottom: 6px; border-radius: 3px;
  border: 0.7px solid $highlight35; }
.word { position: absolute; left: 0; right: 0; text-align: center; font-family: var(--title-font); font-weight: 700;
  color: $ink; text-shadow: 0 0.6px 0 $highlight35; letter-spacing: .06em; }
.word.top { top: 30px; font-size: 26px; line-height: 1; }
.word.sub { top: 58px; font-size: 11px; letter-spacing: .32em; }
.word.tag { bottom: 24px; font-size: 9px; letter-spacing: .3em; color: $ink; }
/* the oval: the ink's frame, the oval palette marbled inside it */
.oval { position: absolute; left: 39px; top: 84px; width: 172px; height: 214px; border-radius: 50%;
  background:
    url("$noise"),
    radial-gradient(ellipse at 50% 40%, $oval0 0%, $oval1 35%, $oval2 70%, $oval3 100%);
  box-shadow: 0 0 0 4.5px $ink, 0 0 0 6px $oval3, 0 0 0 7.2px $ink, inset 0 0 22px $shade60; }
.oval svg { position: absolute; left: 0; top: 0; width: 100%; height: 100%; }
/* five small dots under the oval, colourless here: it's a five-colour game's back, so nod to it */
.dots { position: absolute; left: 0; right: 0; bottom: 40px; display: flex; justify-content: center; gap: 7px; }
.dots i { width: 6.5px; height: 6.5px; border-radius: 50%; display: block; border: 0.8px solid $ink; }
</style>
<div class="card">
  <div class="field"></div>
  <div class="word top">$word</div>
  <div class="word sub">$sub</div>
  <div class="oval">
$emblem
  </div>
  <div class="dots">
$dots
  </div>
  <div class="word tag">$tag</div>
</div>
