<!doctype html>
<meta charset="utf-8">
<style>
/* BLS card back. Same page as the front: 1 CSS px = 1/100 in, 272x372 with bleed. */
$local_fonts
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 272px; height: 372px; background: #0a0806; overflow: hidden; }
.card { position: absolute; left: 11px; top: 11px; width: 250px; height: 350px; border-radius: 9px; overflow: hidden;
  background: #0a0806; }
/* the parchment field: warm brown with grain and a darker vignette toward the edges */
.field { position: absolute; left: 9px; top: 9px; right: 9px; bottom: 9px; border-radius: 5px;
  background:
    url("$noise"),
    radial-gradient(ellipse at 50% 45%, #b08553 0%, #8e6537 45%, #5d3f21 85%, #3d2814 100%);
  box-shadow: inset 0 0 0 1.2px rgba(0,0,0,.6), inset 0 0 0 2.4px rgba(255,220,170,.22), inset 0 0 18px rgba(0,0,0,.45); }
.field::after { /* thin inner rule, like the printed back's pinstripe */
  content: ""; position: absolute; left: 6px; top: 6px; right: 6px; bottom: 6px; border-radius: 3px;
  border: 0.7px solid rgba(255,225,180,.35); }
.word { position: absolute; left: 0; right: 0; text-align: center; font-family: var(--title-font); font-weight: 700;
  color: #1c1208; text-shadow: 0 0.6px 0 rgba(255,230,190,.35); letter-spacing: .06em; }
.word.top { top: 30px; font-size: 26px; line-height: 1; }
.word.sub { top: 58px; font-size: 11px; letter-spacing: .32em; }
.word.tag { bottom: 24px; font-size: 9px; letter-spacing: .3em; color: #241809; }
/* the oval: dark frame, warm marbled centre */
.oval { position: absolute; left: 39px; top: 84px; width: 172px; height: 214px; border-radius: 50%;
  background:
    url("$noise"),
    radial-gradient(ellipse at 50% 40%, #e2b06e 0%, #c98a48 35%, #9c5f2c 70%, #6a3d18 100%);
  box-shadow: 0 0 0 4.5px #1f1610, 0 0 0 6px #6d4a26, 0 0 0 7.2px #1f1610, inset 0 0 22px rgba(60,30,10,.6); }
.oval svg { position: absolute; left: 0; top: 0; width: 100%; height: 100%; }
/* five small dots under the oval, colourless here: it's a five-colour game's back, so nod to it */
.dots { position: absolute; left: 0; right: 0; bottom: 40px; display: flex; justify-content: center; gap: 7px; }
.dots i { width: 6.5px; height: 6.5px; border-radius: 50%; display: block; border: 0.8px solid #1c1208; }
</style>
<div class="card">
  <div class="field"></div>
  <div class="word top">BLASTED</div>
  <div class="word sub">STUDIOS</div>
  <div class="oval">
    <svg viewBox="0 0 172 214">
      <defs>
        <radialGradient id="glow" cx="50%" cy="45%" r="45%">
          <stop offset="0" stop-color="#ffd27a" stop-opacity=".95"/>
          <stop offset=".45" stop-color="#e8862e" stop-opacity=".55"/>
          <stop offset="1" stop-color="#e8862e" stop-opacity="0"/>
        </radialGradient>
        <linearGradient id="rock" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#3a2614"/><stop offset="1" stop-color="#160e07"/>
        </linearGradient>
        <linearGradient id="cloud" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#4a3320"/><stop offset="1" stop-color="#1c120a"/>
        </linearGradient>
      </defs>
      <!-- fireball glow behind the summit -->
      <ellipse cx="86" cy="92" rx="62" ry="58" fill="url(#glow)"/>
      <!-- mushroom cloud: cap, then stem widening into the crater -->
      <path fill="url(#cloud)" d="M86 52 c-30 0 -46 14 -46 30 c0 10 8 17 20 19 c-4 6 0 12 8 12 c10 0 14 -6 12 -12
        c8 4 18 -2 18 -10 c0 -3 -2 -6 -5 -8 c14 -2 22 -10 22 -19 c0 -12 -14 -12 -29 -12z"/>
      <path fill="url(#cloud)" d="M74 108 c2 -8 22 -8 24 0 c4 10 -2 22 -12 22 c-10 0 -16 -12 -12 -22z"/>
      <path fill="url(#cloud)" d="M70 128 c6 -6 26 -6 32 0 l6 16 h-44z"/>
      <!-- cloud highlights -->
      <path fill="none" stroke="#e9c48f" stroke-width="1.6" stroke-linecap="round"
        d="M52 78 c4 -12 20 -18 34 -18 M104 66 c8 2 14 6 16 12 M62 104 c4 4 10 6 16 5"/>
      <!-- the mountain, summit blown into a crater -->
      <path fill="url(#rock)" stroke="#0d0804" stroke-width="1.4" stroke-linejoin="round"
        d="M14 190 L56 128 L64 138 L70 130 L78 145 L94 145 L102 130 L110 140 L118 128 L158 190z"/>
      <!-- crater rim lit by the blast -->
      <path fill="none" stroke="#f3c574" stroke-width="1.8" stroke-linecap="round" d="M62 138 L70 130 L78 145 L94 145 L102 130 L110 140"/>
      <!-- flung debris -->
      <g fill="#1c120a">
        <path d="M36 96 l5 -4 l2 6z"/><path d="M132 90 l6 -2 l-1 6z"/><path d="M44 116 l4 -3 l1 5z"/>
        <path d="M128 118 l5 -4 l1 6z"/><path d="M148 104 l4 -1 l-1 5z"/><path d="M26 124 l4 -2 l0 5z"/>
      </g>
      <!-- snow / ridge lines on the flanks -->
      <path fill="none" stroke="#5a3d22" stroke-width="1.2" stroke-linecap="round" d="M60 150 L52 170 M112 150 L124 174 M86 150 L84 178"/>
      <!-- ground line -->
      <path fill="#0d0804" d="M8 190 h156 v6 h-156z" opacity=".85"/>
    </svg>
  </div>
  <div class="dots">
    <i style="background:#f4ecd4"></i><i style="background:#3b6fb5"></i><i style="background:#2e2a2c"></i>
    <i style="background:#c8402d"></i><i style="background:#2f7a48"></i>
  </div>
  <div class="word tag">TCG · MINT</div>
</div>
