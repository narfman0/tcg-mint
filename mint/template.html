<!doctype html>
<meta charset="utf-8">
$font_link
<style>
/* M15-style frame. 1 CSS px = 1/100 in; card 2.5x3.5in inside 0.11in bleed -> 272x372.
   Geometry measured off Scryfall's 745x1040 scans, rounded to the nearest 1/100 in. */
$local_fonts
:root {
  --frame: $frame;          /* the coloured frame between border and boxes */
  --frame-dark: $frame_dark;
  --bar: $bar;              /* title / type bar fill */
  --bar-edge: $bar_edge;
  --box: $box;              /* text box fill */
  --pinline: $pinline;      /* the flat colour inside the textured band: outlines every element, fills the gaps */
  --frame-b: $frame_b;      /* the right-hand colour of a two-colour card (.pair); the left's on any other */
  --box-b: $box_b;
  --pinline-b: $pinline_b;
  --ink: #000;
  --title-font: $title_font;
  --body-font: $body_font;
  /* text position inside its bar, calibrated against Scryfall scans with
     calibrate.py: real title text sits ~0.6 below the bar's geometric centre,
     type-line text ~1.1 below. Positive = down. */
  --title-dy: 0.7px;
  --type-dy: 0.7px;
  --pt-dy: 0.6px;
  --rarity-hi: $rarity_hi;  /* the rarity's highlight colour, for --rarity-tint */
}
/* the frame's dressing: each knob a strength 0-1, from the set file's frame block (sets.Frame) */
$frame_vars
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 272px; height: 372px; background: #000; overflow: hidden; }
.card { position: absolute; left: 11px; top: 11px; width: 250px; height: 350px;
  background: #000; border-radius: 10.5px; overflow: hidden; color: var(--ink); }
/* the border is pure black, the same as the bleed around it, so a cut that lands in the bleed is invisible. Scans read
   it as a warm near-black (#16130e), but that is ink through a scanner: the design files (Wizards' own renders on
   Scryfall, Card Conjurer's M15 frame) are #000, and 0,0,0 is what lets an inkjet driver lay down black ink alone. */
/* Geometry below is measured off Scryfall's 745x1040 scans (mint/calibrate.py):
   border 10, title bar 17-36.6, art 38.5-195, type bar 196.5-216, text box
   218.5-322.5, P/T box 313-333, collector text 329-339, bottom border from 324.
   Re-measured at 1/10 unit by six independent passes over five scans: border
   10; textured band 10-12.8 (crisp edge, no bevel); pinline 2 wide around the
   perimeter, 1.2-1.7 in the gaps; bars' outline 14.8-235 (title 17-37.2, type
   197-217); art line 18.6-19.6, image 19.6-230.2 x 39.7-193.7; text box face
   18.6-231.4 x 218.4-322. A pinline plate under everything casts a 2-unit
   shadow to its left and a pale ridge above and to its right (light from the
   upper right). At 1200 dpi Chromium snaps edges to whole units, so the
   values that matter sit on whole numbers. */
/* the band ends at 314.5 under the text box, which overhangs it by 8, and its bottom corners are 20-unit arcs
   (traced off the scans: the band leaves the sides at 294 and meets the text box's edge at 309) */
.frame { position: absolute; left: 10px; top: 10px; right: 10px; bottom: 36.5px; border-radius: 5px 5px 22px 22px; isolation: isolate;
  background: var(--frame); }
/* a legendary card's crown stands against black: the band starts under the crown, so the valleys show the border */
.legendary .frame { top: 15px; border-top-left-radius: 0; border-top-right-radius: 0; }
.legendary .pl-title { display: none; }  /* the crown meets the bar's outline directly */
/* ... and the art's pinline starts under the tongue piece (.pl-crown), which covers the rail from the badge's foot
   down: the dark ramp under the badge is the piece's own top bevel, and the art's plate would cover it from x 17 */
.legendary .pl-art { top: 43px; height: 153.4px; }
/* The bars' ends, and the pinline pills' around them, are not arcs. Traced off four scans (rows at 1/2 unit, each
   scan's edge taken against its own rail beside the text box), the bar's outline leaves the top edge 3.2 in from
   the bar's outermost point on a diagonal of about 40 degrees from vertical, rounds off over the next four units and
   is flat at the middle: a pointed oval. The pinline pill around it is the same kind of curve 2 out, 4 in at its top
   and bottom -- the rail beside the art and the text box, once Chromium has snapped both boxes to whole units (13 +
   4 = 17) -- so the pill leaves the rail and rejoins it on that diagonal instead of meeting it at an angle; the
   scans' pills rejoin the rail 0.6 above where the old arcs ended, so the pieces are 22.8 tall, not 23.4. Measured
   depths off the rail, type bar, pill (bar outline): 0.4 at 195.5, 1.1 (-1.8) at 196.5, 1.4 (-1.2) at 197, 1.9
   (-0.7) at 197.5, 2.4 (0.2) at 199, 2.85 (0.7) at 200, 3.2 (1.1) at 201, 3.5 (1.6) at 203, 3.8 (2.0) from 205 to
   209, the mirror below; the title bar within 0.3 of the same. Each end is one cubic per corner, fitted to those rows
   by least squares (within 0.15 on the pill's top half, 0.4 on its bottom, where the scans' pills sit a little
   higher than ours) and sampled into a polygon so one shape fits a bar of any width (a battle's bars are 322 and 168
   wide): the pill M4,0 C2.6,3 1,3 .2,10; the bar M3.2,0 C3.6,.8 0,2.5 0,10. A chord is 0.05 off its curve at most. */
:root {
  --pill-shape: polygon(4px 0.0%, 3.47px 4.4%, 2.93px 8.1%, 2.39px 11.6%, 1.88px 15.4%, 1.38px 20.0%, 0.93px 25.9%, 0.54px 33.7%, 0.20px 43.9%, 0.20px 56.1%, 0.54px 66.3%, 0.93px 74.1%, 1.38px 80.0%, 1.88px 84.6%, 2.39px 88.4%, 2.93px 91.9%, 3.47px 95.6%, 4px 100.0%, calc(100% - 4px) 100.0%, calc(100% - 3.47px) 95.6%, calc(100% - 2.93px) 91.9%, calc(100% - 2.39px) 88.4%, calc(100% - 1.88px) 84.6%, calc(100% - 1.38px) 80.0%, calc(100% - 0.93px) 74.1%, calc(100% - 0.54px) 66.3%, calc(100% - 0.20px) 56.1%, calc(100% - 0.20px) 43.9%, calc(100% - 0.54px) 33.7%, calc(100% - 0.93px) 25.9%, calc(100% - 1.38px) 20.0%, calc(100% - 1.88px) 15.4%, calc(100% - 2.39px) 11.6%, calc(100% - 2.93px) 8.1%, calc(100% - 3.47px) 4.4%, calc(100% - 4px) 0.0%);
  --bar-shape: polygon(3.20px 0.0%, 3.18px 1.8%, 2.87px 4.2%, 2.36px 7.7%, 1.75px 12.4%, 1.12px 18.8%, 0.56px 26.9%, 0.15px 37.2%, 0 50.0%, 0 50.0%, 0.15px 62.8%, 0.56px 73.1%, 1.12px 81.2%, 1.75px 87.6%, 2.36px 92.3%, 2.87px 95.8%, 3.18px 98.2%, 3.20px 100.0%, calc(100% - 3.20px) 100.0%, calc(100% - 3.18px) 98.2%, calc(100% - 2.87px) 95.8%, calc(100% - 2.36px) 92.3%, calc(100% - 1.75px) 87.6%, calc(100% - 1.12px) 81.2%, calc(100% - 0.56px) 73.1%, calc(100% - 0.15px) 62.8%, 100% 50.0%, 100% 50.0%, calc(100% - 0.15px) 37.2%, calc(100% - 0.56px) 26.9%, calc(100% - 1.12px) 18.8%, calc(100% - 1.75px) 12.4%, calc(100% - 2.36px) 7.7%, calc(100% - 2.87px) 4.2%, calc(100% - 3.18px) 1.8%, calc(100% - 3.20px) 0.0%);
}
/* the flat pinline is a stroke, not a backdrop: a 1.8-unit band of the colour around the perimeter of each element,
   following its shape (the bars' arcs, the boxes' straight sides), the strokes merging across the gaps;
   the textured band shows everywhere outside them. They are one layer, painted before every element, so no element's
   line can cover another's pinline and the band is the same width all round; the elements sit on this plate and it,
   not they, casts the shadow (to the left: the light comes from the right on the real cards). */
/* the plate is painted twice, its shade under its light, so neither shadow is a copy of the other: chained
   drop-shadows had the white one bleeding under the black and the black one dipping into the ridge */
.pinlines { position: absolute; inset: 0; }
.pinlines.shade { filter: drop-shadow(-1.5px 0.6px 0.4px rgba(0,0,0,.85)); }
.pinlines.light { filter: drop-shadow(0.9px -1.1px 0.3px rgba(255,255,255,.18)); }
.pinline { position: absolute; background: var(--pinline); }
/* (named pl-*, not after the elements: a piece called "art" would match the art window's own rule); 2 outside each
   element on the perimeter, meeting across the 1.2-1.7 gaps */
.pl-title { left: 12.8px; top: 15px; width: 224.4px; height: 22.8px; clip-path: var(--pill-shape); }
.pl-type { left: 12.8px; top: 195px; width: 224.4px; height: 22.8px; clip-path: var(--pill-shape); }
.pl-art { left: 16.6px; top: 37.4px; width: 216.8px; height: 159px; }
/* the text box's plate is a plain rectangle: its top corners sit under the type bar's arcs, which land on its sides
   (traced off the scans, the pinline's edge runs 16.0, 16.4, 16.7 down the arc then 17.1 straight down the box, one
   convex line). The top sits above where the arc crosses the side (216.66 as written, 216.46 once Chromium snaps
   the boxes to whole units, so 216.4 rounds to 216): a chamfer there, or a top below the crossing, leaves the arc
   curling in past the box's edge, a notch in the outline with the plate's shadow pooled dark inside it. */
.pl-text { left: 16.6px; top: 216.4px; width: 216.8px; height: 107.2px; }
/* the colour's painted texture (frame.TEXTURES), light veins and tinted shadows over the flat fill, faded by its knob.
   The band's edge is a crisp step, as on the cards: no bevel line, no ring */
.frame::before { content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none;
  background: url("$texture"); background-size: 128px 128px; opacity: var(--frame-texture); }
/* the legendary crown: its shape is the traced profile frame.CROWN, set on each element as an inline clip path
   in card units (the elements span the card), the black outline a copy pushed out 1.3 around the top and sides;
   the badge ends 1.6 under the bar (38.8, its outline to 39.3), its tails coming to a point at each side (frame.CROWN_FOOT) */
.crown-o, .crown { position: absolute; left: 0; top: 0; width: 250px; height: 60px; }
/* the badge is the pinline colour, whitened toward the centre, brighter than everything around it; the outline layer
   is black round the top and sides, but under the bar it is a 50% grey over the tongue's own bevel: the 0.5 line
   under the badge and the hook rounding each tail's inside read 25-45% of the pinline on Scryfall's renders (Talrand
   11-14 of 31, Rishkar 7-12 of 26, Gonti 5-9 of 20, Etali 6-14 of 43) where the bar's outline reads 2-5, and a 70%
   grey came out at 17%. Below the tail the two halves differ,
   the light coming from the upper right: on the left the outline runs on down the tongue's edge as a wedge of
   shadow over the band out to the border (frame.CROWN_FOOT_O), fading with depth -- the band beside the tail reads
   ~10% of its brightness at 43-44, ~25% at 48, ~35% at 52 and clear by 54, and the plate's own shadow gives 15-45%
   of that on its own; on the right the band is clear, 60-90% at 44 and clear by 45.5 (Talrand, Rishkar, Etali,
   Jaxis), with a soft grey smudge under the tip (Etali 45-60% at 42, 65-75% at 44), so its wedge is short
   (frame.CROWN_FOOT_O_R) and its gradient is 0 by 45.5. Two gradients, one per half of the card */
.crown-o { background:
  linear-gradient(180deg, #000 0, #000 38.5px, rgba(0,0,0,.5) 38.8px, rgba(0,0,0,.5) 44px, rgba(0,0,0,.25) 48px,
    rgba(0,0,0,.05) 52px, rgba(0,0,0,0) 54px) 0 0 / 50% 100% no-repeat,
  linear-gradient(180deg, #000 0, #000 38.5px, rgba(0,0,0,.5) 38.8px, rgba(0,0,0,.5) 41.5px, rgba(0,0,0,.3) 42.5px,
    rgba(0,0,0,.15) 44px, rgba(0,0,0,0) 45.5px) 100% 0 / 50% 100% no-repeat; }
.crown { background: linear-gradient(90deg, var(--pinline) 25%, color-mix(in srgb, var(--pinline) 60%, #fff) 50%, var(--pinline) 75%); }
/* the tongues under the crown's feet are the pinline plate's, not the badge's: one piece up beside the art from
   its rail to the badge's foot, the plate's shadow falling off it to the left like everywhere else. Traced off
   Scryfall's renders of Talrand (OTC), Rishkar (J25), Gonti (OTC) and Etali (FDN), the two sides within 0.3 of each
   other: the tongue's edge is at 12.2 straight down to 53, then curves in to the rail, 13.4 at 54.5, 15.0 at 57,
   16.05 at 60.2, 16.6 by 62.5 -- and ours ends on 17, where Chromium snaps the art's plate (13 + 4 = 17), so the
   curve meets the rail without a jog. A dark bevel runs inside its top and outer edges, ~45% of the pinline at
   the edge, 65% at 0.7 in, 80% at 1.5, 90% at 2.2, clear at 2.9 (the rail below has none): an inset shadow,
   blurred, since a gradient tile the width of the bevel came out snapped a unit off its edge; along the top it
   is the dark ramp under the badge, running the width of the rail. Beyond the outer edge the lit side is clear
   along the straight run, but a shadow lies under the curve, ~2 wide at 55-58 (Etali 35-60% of the band, Rishkar
   40-50%) and ~1 at 60-62: the piece casts a shadow of its own straight down in the shade copy, which a vertical
   edge hides and the curve reveals. The bottom of the piece tucks inside the art's pinline, so its only free
   edges are the tongues'; the shape is on ::before so the shadow is not clipped away with it */
.pl-crown { display: none; left: 12.2px; top: 38.9px; width: 225.6px; height: 28.6px; }
.legendary .pl-crown { display: block; }
.pinlines .pinline.pl-crown { background: none; }
.pinlines.shade .pl-crown { filter: drop-shadow(0 2.4px 0.9px rgba(0,0,0,.6)); }
.pl-crown::before { content: ""; position: absolute; inset: 0; background: var(--pinline);
  box-shadow: inset 0 0 3.6px rgba(0,0,0,.95);
  clip-path: path('M0 0 L0 14.1 C1.6 15.6 4.6 19.6 4.8 24.6 L4.8 26.1 L8 28.6 L217.6 28.6 L220.8 26.1 L220.8 24.6 \
C221 19.6 224 15.6 225.6 14.1 L225.6 0 Z'); }
/* two-colour cards (frame.frame_pair): the pinline and text box run the left colour into the right across the
   middle, the bars staying a flat grey; a hybrid spell's band blends too, its two textures cross-fading, where a
   dual land keeps the land band. Every element is centred on the card, so each blends about its own middle.
   Measured off ten scans (RVR shocks, MH2 fetches, UMA / RVR / MKC hybrids): the pinline blends over 102-148,
   the text box 105-140, the band 100-160 */
.pair .pinline { background: linear-gradient(90deg, var(--pinline) calc(50% - 23px), var(--pinline-b) calc(50% + 23px)); }
.pair .textbox { background: linear-gradient(90deg, var(--box) calc(50% - 18px), var(--box-b) calc(50% + 18px)); }
.hybrid .frame { background: linear-gradient(90deg, var(--frame) calc(50% - 30px), var(--frame-b) calc(50% + 30px)); }
.hybrid .frame::before { mask-image: linear-gradient(90deg, #000 calc(50% - 30px), transparent calc(50% + 30px)); }
.hybrid .frame::after { content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none;
  background: url("$texture_b"); background-size: 128px 128px; opacity: var(--frame-texture);
  mask-image: linear-gradient(90deg, transparent calc(50% - 30px), #000 calc(50% + 30px)); }
.pair .crown { background: linear-gradient(90deg, var(--pinline) 25%,
  color-mix(in srgb, color-mix(in srgb, var(--pinline) 50%, var(--pinline-b)) 60%, #fff) 50%, var(--pinline-b) 75%); }
.pair .pl-crown::before { background: linear-gradient(90deg, var(--pinline) calc(50% - 23px), var(--pinline-b) calc(50% + 23px)); }
/* the bars span 14.8-235 outline included, 4.8 past the art on each side, 20 tall, their ends the pointed ovals of
   --bar-shape; the fill is flat (the bottom shade is the bevel's), the bevel lit from the upper right. The outline
   is a unit of black just inside the clip (a 0.5 border always rendered as 1): two cap images draw the ends' curve
   as a 2-wide stroke astride the edge (the outer half falls to the clip), two gradients the hairlines along the
   top and bottom between them (each the full height with its unit of black at one edge: a thin image set at the
   bottom is snapped out of the box and never paints); a transparent
   border of the same half unit keeps the bevel's inset shadows off the outline, as the black border did */
.bar { position: absolute; left: 14.8px; width: 220.2px; height: 20.2px; padding: 0 5.2px;
  display: flex; align-items: center; justify-content: space-between;
  clip-path: var(--bar-shape); border: 1px solid transparent;
  background:
    url("data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 12 20%22 preserveAspectRatio=%22none%22%3E%3Cdefs%3E%3Cfilter id=%22b%22 x=%22-1%22 y=%22-1%22 width=%223%22 height=%223%22%3E%3CfeGaussianBlur stdDeviation=%220.9%22/%3E%3C/filter%3E%3C/defs%3E%3Cpath d=%22M3.2 0 C3.6 0.8 0 2.5 0 10 C0 17.5 3.6 19.2 3.2 20%22 fill=%22none%22 stroke=%22rgba%280,0,0,.45%29%22 stroke-width=%225%22 filter=%22url%28%23b%29%22/%3E%3Cpath d=%22M12 0 H3.2 C3.6 0.8 0 2.5 0 10 C0 17.5 3.6 19.2 3.2 20 H12%22 fill=%22none%22 stroke=%22%23000%22 stroke-width=%222%22/%3E%3C/svg%3E") left top / 12px 100% no-repeat,
    url("data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 12 20%22 preserveAspectRatio=%22none%22%3E%3Cdefs%3E%3Cfilter id=%22b%22 x=%22-1%22 y=%22-1%22 width=%223%22 height=%223%22%3E%3CfeGaussianBlur stdDeviation=%220.5%22/%3E%3C/filter%3E%3C/defs%3E%3Cpath d=%22M8.8 0 C8.4 0.8 12 2.5 12 10 C12 17.5 8.4 19.2 8.8 20%22 fill=%22none%22 stroke=%22rgba%28255,255,255,.4%29%22 stroke-width=%223.6%22 filter=%22url%28%23b%29%22/%3E%3Cpath d=%22M0 0 H8.8 C8.4 0.8 12 2.5 12 10 C12 17.5 8.4 19.2 8.8 20 H0%22 fill=%22none%22 stroke=%22%23000%22 stroke-width=%222%22/%3E%3C/svg%3E") right top / 12px 100% no-repeat,
    linear-gradient(#000 1px, transparent 1px) 12px 0 / calc(100% - 24px) 100% no-repeat,
    linear-gradient(to top, #000 1px, transparent 1px) 12px 0 / calc(100% - 24px) 100% no-repeat,
    /* the bevel, lit from the upper right like everything else: the top edge catches the light, the bottom falls
       dark (the ends' shading is in the cap images, a soft band along the curve); gradients, not inset shadows,
       which paint over the background and washed the outline out where the ends' curve runs under the top light.
       Each sits a unit in, where the padding box begins, as the inset shadows did */
    linear-gradient(rgba(255,255,255,.55) 0, rgba(255,255,255,.35) 1.2px, transparent 2.4px) 0 1px / 100% 100% no-repeat,
    linear-gradient(to top, rgba(0,0,0,.6) 1.6px, transparent 1.6px) 0 -1px / 100% 100% no-repeat,
    linear-gradient(180deg, color-mix(in srgb, var(--bar) 94%, #fff) 0, var(--bar) 12%, var(--bar) 100%);
  background-origin: border-box; background-clip: border-box; }
.titlebar { top: 17px; padding-right: 4.5px; }
.typebar { top: 197px; height: 20px; padding: 0 4px 0 5px; }
.name { font-family: var(--title-font); font-size: 13.1px; font-weight: 700; white-space: nowrap; letter-spacing: .012em; word-spacing: .04em;
  position: relative; top: var(--title-dy); }
.type { font-family: var(--title-font); font-size: 11.3px; font-weight: 700; white-space: nowrap; position: relative; top: var(--type-dy); }
/* the pips sit 1.1 above the bar's geometric centre: the bar's dark bottom bevel and each disc's shadow crescent
   both weigh the eye downward, and the real cards' discs clear the face top and bottom by the same 2.2 */
.cost { display: flex; gap: 1px; flex: none; margin-left: 4px; position: relative; top: -1.1px; }
/* Pip shadow: a black disc behind the symbol, offset for a light at ~75 degrees
   upper-right (mostly down, a little left). Not drop-shadow(): Chromium floors
   its offsets to whole CSS px, which at 100 px/in turns (-0.24, 0.88) into (-1, 0). */
.pip { position: relative; width: 12px; height: 12px; display: block; }
.pip::before { content: ""; position: absolute; inset: 0; border-radius: 50%; background: #000;
  transform: translate(-0.24px, 0.88px); }
.pip img { position: relative; height: 12px; width: 12px; display: block; }
/* the expansion symbol keeps its size whatever the type line does: a flex item shrinks by default, and a
   long type line (Purphoros' "Legendary Enchantment Creature — God") ate it down to a speck before the
   fit below learned to shrink the type instead. The gap is the pips', so text never butts against it */
.setsym { height: 14px; width: 14px; flex: none; margin-left: 4px; }
/* stacking, settled here so a design (frame.DESIGNS) puts the art under the frame by moving it and nothing
   else: the band and the pinline plate at the bottom, the art over them, and everything that may float over
   the art -- the bars, the text box, the P/T plate, the stamp, the badges, the crown, the footer -- above it */
.art { z-index: 1; }
.bar, .textbox, .pt, .stamp, .loyalty, .defense, .crown-o, .crown, .footer { z-index: 2; }
/* the art window: the image spans 19.6-230.2 x 39.7-193.7, its one black line drawn just outside it */
.art { position: absolute; left: 19.6px; top: 39.7px; width: 210.6px; height: 154px;
  background: #222 center / cover no-repeat; background-image: url("$art");
  filter: $art_filter; }
/* the text box face 18.6-231.4 x 218.4-322; recessed with hard edges: a thin fall-off on the right wall, a light
   rim along the bottom. Rules text is MPlantin at 12.6 on a 0.98 pitch, the gaps in em so they scale with a fit */
.textbox { position: absolute; left: 18.6px; top: 218.4px; width: 212.8px; height: 103.6px; padding: 1.5px 3.4px 2px;
  background: var(--box);
  /* a dark wall along the top and right (the light is from the upper right), a light rim along the bottom */
  box-shadow: inset 0 1.2px 0 rgba(0,0,0,.43), inset -1.8px 0 .6px rgba(0,0,0,.5), inset 0 -1.3px 0 rgba(255,255,255,.7);
  clip-path: polygon(.5px 0, calc(100% - .5px) 0, 100% .5px, 100% 100%, 0 100%, 0 .5px);
  font-family: var(--body-font); font-size: 12.6px; line-height: .98; word-spacing: .03em;
  display: flex; flex-direction: column; justify-content: safe center; overflow: hidden; }
.textbox p { margin-bottom: .3em; }
.textbox.centred { text-align: center; }  /* a lone single line sits centred, as on the real cards */
.textbox p:last-child { margin-bottom: 0; }
.textbox img.sym { height: .78em; width: .78em; vertical-align: -0.06em; margin: 0 .03em; }
.textbox .reminder, .textbox .ability, .flavor { font-style: italic; }
.flavor .upright { font-style: normal; }
.textbox .big-sym { display: flex; justify-content: center; }
.textbox .big-sym .pip, .textbox .big-sym .pip img { width: 58px; height: 58px; }
.textbox .big-sym .pip::before { background: rgba(0,0,0,.55); transform: translate(-1.2px, 4.4px); }
.textbox .nowrap { white-space: nowrap; }
/* the flavour divider: a full-width debossed groove, a soft shade above a hairline highlight */
.flavor { margin-top: -1px; padding-top: 8px; position: relative; }
.flavor::before { content: ""; position: absolute; left: 2px; right: 2px; top: 0; height: 1.4px;
  background: rgba(0,0,0,.22); box-shadow: 0 .4px 0 rgba(255,255,255,.6); }
/* the P/T plate (frame.pt_plate draws it as an inline SVG: bowed ends, sloped walls lit from the upper right, a
   flat face): the box sits at 310.5 with its right edge at 235.7, raised off the card by a lift shadow, the number
   centred on the face and nudged down to sit where the real one does */
.pt { position: absolute; right: 14.3px; top: 310.5px; height: 20px;
  display: flex; align-items: center; justify-content: center;
  --plate: color-mix(in srgb, var(--bar) 92%, #8c9296); --face: var(--bar);
  filter: drop-shadow(-0.9px 0.7px 1px rgba(0,0,0,.55));
  font-family: var(--title-font); font-size: 13.4px; font-weight: 700; text-align: center; }
.pt .plate { position: absolute; inset: 0; height: 20px; }
.pt span { position: relative; z-index: 1; top: calc(var(--pt-dy) + 1.4px); display: block; line-height: 1; }
/* the dressing, each drawn by its knob: the art window's black line; linen grain and a rarity tint over the
   bars and text box (behind their text: the boxes isolate, the layers sit at z -1); the set symbol as
   a watermark behind the rules text; the holofoil oval under the text box on rares and mythics */
.art::after { content: ""; position: absolute; inset: 0; pointer-events: none; opacity: var(--art-bevel);
  box-shadow: 0 0 0 1px #000; }
.bar, .textbox { isolation: isolate; }
.bar::after, .textbox::after { content: ""; position: absolute; inset: 0; z-index: -1; pointer-events: none; border-radius: inherit;
  background: url("$noise"); mix-blend-mode: overlay; opacity: var(--box-grain); }
.bar::before { content: ""; position: absolute; inset: 0; z-index: -1; pointer-events: none; border-radius: inherit;
  background: var(--rarity-hi); mix-blend-mode: soft-light; opacity: var(--rarity-tint); }
.textbox::before { content: ""; position: absolute; inset: 0; z-index: -1; pointer-events: none;
  background: url("$watermark") center / 64px no-repeat; opacity: calc(var(--watermark) * .16); }
/* the security stamp (frame.stamp_kind): the holofoil oval of a rare or mythic, or the printing's own shape --
   Universes Beyond's triangle, the Un-sets' acorn, the Signature Spellbooks' circle -- each with its own bite out
   of the text box's bottom edge, the pinline following. The oval, traced off three scans (UGIN 146, SLD 176, PDFT
   268p): 21.6 x 11 at 319.2, centred 125 x 324.7; its bite a circular arc 34 wide at the box's foot and 7 deep
   (radius 24.1, centre 17.1 below the foot). The pinline's hole is the same arc 2 *in* (radius 22.1): the plate
   lines the inside of the bite as it lines the outside of the box everywhere else, so the rim is 2 all round and
   3.6 where the arcs meet the foot obliquely (the scans' 107.4 to 111); the black border shows through the rest
   of the bite around the stamp. The
   triangle, traced off three Universes Beyond scans (WHO 57, LTC 269, LTC 75): the box's bite is a trapezoid, its
   flat top 107.9-142.5 at 316, its sides closing 0.45 a unit to 110.4-140.3 at the box's foot, the pinline's rim
   3.5 wide inside it; the stamp itself is a rounded triangle, apex down, 22 wide at 319.5 and 11.5 tall to its
   point at 331, in a band of the black border 2.5 wide. The acorn sits in the oval's bite, 12 tall. The circle is
   the Spellbook frame's, approximated: a round stamp in a round bite. */
.stamp { position: absolute; left: 50%; top: 319.2px; width: 21.6px; height: 11px; margin-left: -10.8px; border-radius: 50%;
  opacity: var(--foil-stamp);
  background: radial-gradient(ellipse at 40% 35%, #e8e8e8, #9a9a9a 60%, #6f6f6f);
  box-shadow: inset 0 0 0 .6px rgba(255,255,255,.5); }
.stamped .textbox { clip-path: path('M.5 0 H212.3 L212.8 .5 V103.6 H123.4 A24.1 24.1 0 0 0 89.4 103.6 H0 V.5 Z'); }
.stamped .pl-text { clip-path: path('M0 0 H216.8 V107.2 H124.15 A22.1 22.1 0 0 0 92.65 107.2 H0 Z'); }

  background: radial-gradient(ellipse at 45% 25%, #e8e8e8, #9a9a9a 60%, #6f6f6f);
  clip-path: path('M1.2 0 H20.8 Q22 0 21.4 1 L11.9 10.9 Q11 11.8 10.1 10.9 L.6 1 Q0 0 1.2 0 Z'); }
.stamp-triangle .textbox { clip-path: path('M.5 0 H212.3 L212.8 .5 V103.6 H121.7 L123.9 97.6 H89.3 L91.8 103.6 H0 V.5 Z'); }
.stamp-triangle .pl-text { clip-path: path('M0 0 H216.8 V107.2 H119.9 L123.1 101.6 H94.8 L98 107.2 H0 Z'); }
.stamp.acorn { background: none; box-shadow: none; border-radius: 0; top: 318.4px; width: 12px; height: 12px; margin-left: -6px; }
.stamp.acorn img { display: block; width: 12px; height: 12px; }
.stamp.circle { top: 316px; width: 12px; height: 12px; margin-left: -6px; box-shadow: inset 0 0 0 .6px rgba(255,255,255,.5);
  background: radial-gradient(circle at 40% 35%, #e8e8e8, #9a9a9a 60%, #6f6f6f); }
.stamp-circle .textbox { clip-path: path('M.5 0 H212.3 L212.8 .5 V103.6 H115.85 A9.5 9.5 0 1 0 96.95 103.6 H0 V.5 Z'); }
.stamp-circle .pl-text { clip-path: path('M0 0 H216.8 V107.2 H115.43 A7.5 7.5 0 1 0 101.37 107.2 H0 Z'); }
/* --- the other layouts. Everything above is the normal frame; each of these moves its parts. --- */
/* double-faced: the face's icon before its name, and the other face named at the foot of the text box */
.dfc { display: inline-block; font-size: .8em; margin-right: 3px; opacity: .8; }

/* planeswalker: the text box is a plain white sheet with a black outline in place of the bevel and pinline, inset on
   the left so the loyalty badges straddle its edge over a wide flat strip; a badge per ability, a row per
   paragraph shaded in turn, and the loyalty shield bottom right straddling the box's foot and the frame.
   Measured off Chandra, Flameshaper (FDN 81), Karn, Scion of Urza (DOM 1), Teferi, Hero of Dominaria (DOM 207),
   Vivien Reid (M19 208) and Ajani, Strength of the Pride (M20 2), all within half a unit of each other:
   the flat strip runs 14.8-234.4 with the plate's shadow line at 13.4-14.8; the box's outline 29.3-30.3 and
   230.3-231.3, its face 30.3-230.3; the outline's top 2.3 under the type bar (219.3) and its bottom 5 above the
   frame's foot (319.5), 1 thick; the face 220.2-318.6. The box's bottom corners are shallow ellipses (38 x 8.5,
   fitted to the outline traced down Karn's and Teferi's bottom-left corner to 0.2), and the strip's foot follows
   the black border in a big sweep (traced on the same scans, 14.8 at 309.5 to 64 at 324.5) where a creature's
   plate keeps its square corner. No bevel: the printed box is a translucent sheet over the art. */
.planeswalker .pl-text { left: 14.8px; width: 219.6px; height: 108.1px;
  clip-path: path('M0 0 H219.6 V93.1 C219.6 105.1 182.4 108.1 170.4 108.1 H49.2 C37.2 108.1 0 105.1 0 93.1 Z'); }
.pw-line { position: absolute; left: 29.3px; top: 219.3px; width: 202px; height: 100.2px; background: #000; z-index: 2;
  border-radius: 0 0 39px 39px / 0 0 9.5px 9.5px; }
.planeswalker .textbox { left: 30.3px; top: 220.2px; width: 200px; height: 98.4px; padding: 0; box-shadow: none;
  overflow: visible; border-radius: 0 0 38px 38px / 0 0 8.5px 8.5px; font-size: 8.8px;
  /* the clip reaches 20 left of the box for the badges' overhang, and there runs to the foot's level: a last row's
     badge points down past the corner's ellipse (Chandra's -4 ends 7 above the foot on the print), over the strip,
     whose own foot is 3.4 lower still; the corners are the ellipses of the border-radius */
  clip-path: path('M-20 0 H200 V89.9 A38 8.5 0 0 1 162 98.4 H38 A38 8.5 0 0 1 0 89.9 V98.4 H-20 Z'); }
/* the stamp's bite in the box's foot and the strip's, the same arcs as the normal frame's about the same centre;

.planeswalker.stamped .textbox {
  clip-path: path('M-20 0 H200 V89.9 A38 8.5 0 0 1 162 98.4 H107.9 A21 21 0 0 0 81.5 98.4 H38 A38 8.5 0 0 1 0 89.9 V98.4 H-20 Z'); }
.planeswalker.stamped .pw-line { clip-path: path('M0 0 H202 V100.2 H111.4 A22 22 0 0 0 80 100.2 H0 Z'); }
.planeswalker.stamped .pl-text {
  clip-path: path('M0 0 H219.6 V93.1 C219.6 105.1 182.4 108.1 170.4 108.1 H127.4 A22.6 22.6 0 0 0 93 108.1 H49.2 C37.2 108.1 0 105.1 0 93.1 Z'); }
.planeswalker .stamp { top: 316px; }

  clip-path: path('M-20 0 H200 V113.4 A38 8.5 0 0 1 162 121.9 H38 A38 8.5 0 0 1 0 113.4 V121.9 H-20 Z'); }
.planeswalker.tall.stamped .textbox {
  clip-path: path('M-20 0 H200 V113.4 A38 8.5 0 0 1 162 121.9 H107.9 A21 21 0 0 0 81.5 121.9 H38 A38 8.5 0 0 1 0 113.4 V121.9 H-20 Z'); }
.planeswalker.tall.stamped .pw-line { clip-path: path('M0 0 H202 V123.7 H111.4 A22 22 0 0 0 80 123.7 H0 Z'); }
.planeswalker.tall.stamped .pl-text {
  clip-path: path('M0 0 H219.6 V116.6 C219.6 128.6 182.4 131.6 170.4 131.6 H127.4 A22.6 22.6 0 0 0 93 131.6 H49.2 C37.2 131.6 0 128.6 0 116.6 Z'); }
/* the rows: the printed box is a template of slots, not rows that hug their text. On every three-row scan the
   bands break at 30.25 and 64.7 below the box's face (Chandra, Flameshaper FDN 81 with 3/3/3 lines, Ajani Steadfast
   M15 1 3/3/3, Ajani, Caller of the Pride FDN 134 1/2/2, Ajani M20 2, Karn DOM 1, Teferi DOM 207 within 1.5); on
   every four-row tall box at 30.4, 60.1 and 87.1 (Jace, the Mind Sculptor A25 62 with 3/2/1/3 lines, Garruk, Apex
   Predator M15 210 1/2/2/3, Chandra, Awakened Inferno M20 127); a two-row card breaks at 26.2 (Narset, Parter of
   Veils CMM 853). A row grows past its slot only when its text must (Vivien Reid FDN 234's four-line +1: 38.3;
   Chandra, Dressed to Kill INR 148's five-line -7: 43.1), and then the other slots give way toward their own text
   (Vivien's -3 row: 26.6) before the text shrinks; the last row takes what is left; a card of five rows or more
   (Kaito, Bane of Nightmares DSK 220, Ugin, Eye of the Storms TDM 1) shares the leftover out equally over its
   text. The slots here are the scans' at 0.988 (our box is 98.4 to the scans' 99.6), as flex bases: a flex item's
   automatic minimum is its content, so a slot holds its text at least. Each row's text is centred in its band
   (within 1 on every scan); every second band is shaded (the printed sheet is a shade more transparent there:
   214 against 226 over Chandra's art). Rules text is MPlantin at 8.8: the print's "Chandra deals 8 damage divided
   as you" runs 151.5 wide to our 162.6 at 9.4 (0.932, word for word), its x-height 3.7 to our 4.0; the line pitch
   is 8.75 on the scan, the base .98 once the box's 0.988 is taken off; the fit shrinks the long ones. A loyalty
   row's text starts at 46 past the badge and its colon (below) and runs to 227.5 (the print's lines reach 226.8,
   and ours are 0.5% wider word for word: the margin lets the same words share a line); a static row's starts at
   34.4. */
.planeswalker .textbox p { flex: 1 0 auto; display: flex; align-items: center; margin: 0; padding: 0 2.8px 0 0;
  position: relative; z-index: 0; }
/* a loyalty row is never shorter than its badge with its ride (2 x 11.15): a badge poking past the row's foot would
   be scrollable overflow, and the fit would shrink the text to the floor chasing it. The print's short rows
   (Ugin's +2 and 0 at 21.2 and 17.8) let the badges overlap the neighbouring bands instead. The floor is an empty
   flex item of that height, not a min-height: a min-height of its own would replace a flex item's automatic
   minimum (its content), and a slot could then squeeze a row's text out of it */
.planeswalker .textbox p.loyal { padding-left: 15.7px; }
.planeswalker .textbox p.loyal::after { content: ""; flex: none; width: 0; height: 22.4px; }
/* the first row's text starts 3.3-4 below the box's top on the scans (Chandra, Ajani M15 1, Jace A25 62), a
   unit lower than centred; the last row's keeps 4.7-6 clear of the foot (Chandra, Ugin TDM 1) and so of the
   stamp's bite, which the fit does not look at */
.planeswalker .textbox p:first-child { padding-top: 2px; }
.planeswalker .textbox p:last-child { padding-top: 3px; padding-bottom: 3px; }
.planeswalker .textbox p.static { padding-left: 4.1px; }
.planeswalker .rows2 p:last-child, .planeswalker .rows3 p:last-child, .planeswalker .rows4 p:last-child { flex: 1 1 auto; }
.planeswalker .rows2 p:nth-child(1) { flex: 0 1 25.9px; }
.planeswalker .rows3 p:nth-child(1) { flex: 0 1 29.9px; }
.planeswalker .rows3 p:nth-child(2) { flex: 0 1 34px; }
.planeswalker .rows4 p:nth-child(1) { flex: 0 1 30px; }
.planeswalker .rows4 p:nth-child(2) { flex: 0 1 29.3px; }
.planeswalker .rows4 p:nth-child(3) { flex: 0 1 26.7px; }
/* the shaded band is a layer under the row's text, torn along its top and bottom by the noise filter in
   frame.LOYALTY_DEFS. It fills the row exactly: a layer poking out of it would count toward the box's scrollHeight and
    the fit would shrink the text to the floor; the filter's ink beyond the row is not layout, and the box's clip
   cuts what a last row's tear pushes past the foot */
.planeswalker .textbox p:nth-child(even)::before { content: ""; position: absolute; inset: 0; z-index: -1;
  background: rgba(0,0,0,.06); filter: url(#lotear); }
.planeswalker .textbox p > span { flex: 1 1 auto; }
/* a badge (frame.loyalty_badge draws it as an inline SVG) overhangs the box's left edge, its 26-unit box spanning
   12.4-38.4 (centred on the printed badges' 25.4). It is the body of the badge -- the face without its point,
   shoulders to flat end -- that sits centred on the row, so a "+" badge rides up and a "-" badge down by the
   point (measured against the bands on Chandra FDN 81: the bodies 0.9 above, 2.0 and 0.7 below their bands'
   centres; on Vivien Reid FDN 234: 1.0, 0.2 and 1.3 above; --body is the body's centre in the badge's box, from
   frame.loyalty_badge). It takes no part in the row's flow: a row's height is its text's or its slot's. The number
   is white in the title face, Beleren digits 7.6 tall on the scans (0.72 em), centred on the face and nudged down
   as the P/T is; the colon that follows is the rules face's at 13 (its dots 1.7 tall and 6 from top to bottom on
   the scan, the rules text's are 1.1 and 3.7), centred on 41.25 (40.5-42 on the print), level with the number
   (the printed colons sit within 0.7 of the badges' bodies' centres on Chandra, Ajani M15 1 and Karn DOM 1) */
.lcost { position: absolute; left: -17.9px; top: 50%; margin-top: calc(-1 * var(--body)); width: 26px; }
/* in a short last row a "-" badge's point would reach the box's foot: it rides up until the point clears it by 6
   (a row under 34.5 tall; the print's Kaito, Bane of Nightmares DSK 220 keeps its -2 badge 6.3 above the foot
   in a 28.3 row, 3.4 above the row's centre) */
.planeswalker .textbox p:last-child .lcost.down { top: min(50%, calc(100% - 17px)); }
/* the badge's shadow is a hard dark band 2.4 deep straight under it on the print (46 over the strip's 191, 88 over
   the face's 226 at every x under the +2, a shade at 0.5 off the right edge): a drop 2 down, barely blurred, on
   the plate alone (the colon casts none). Chromium floors a drop-shadow's offsets to whole CSS px, so the values
   are whole */
.lcost .shield { position: absolute; left: 0; top: 0; width: 26px; display: block;
  filter: drop-shadow(0 2px .6px rgba(0,0,0,.6)); }
.lcost b { position: absolute; left: 0; width: 26px; text-align: center; line-height: 1;
  transform: translateY(calc(-50% + var(--pt-dy))); color: #fff; font-family: var(--title-font); font-weight: 700;
  font-size: 10.5px; }
.lcost .colon { position: absolute; left: 25px; width: 7.6px; text-align: center; line-height: 1;
  transform: translateY(-50%); color: var(--ink); font-size: 13px; }
/* the loyalty shield (frame.loyalty_box): 36 x 23 with the horn tips at y 2.2, placed so the tips sit at 309.2 and
   the point at 327.5 (15.3 above and 3 below the frame's foot), centred on x 218.9 (the face's edges land within
   0.4 of the scan's down five columns). Its number is Beleren at 13.7: the printed "6" is 9.76 tall (315.7-325.4
   on the scan, 9.1-9.8 on Karn, Ajani, Teferi and Jace), ours 9.83, its centre 10.35 below the horn tips on the
   print; Chromium snaps text to whole CSS px, so the nearest it lands is 0.5 low. The credit line of the footer
   keeps under it (.footer.has-pt) */
.loyalty { position: absolute; left: 200.9px; top: 307px; width: 36px; height: 23px; color: #fff;
  filter: drop-shadow(.5px .7px .5px rgba(0,0,0,.35)); }
.loyalty .shield { position: absolute; left: 0; top: 0; width: 36px; height: 23px; display: block; }
.loyalty span { position: absolute; left: 0; width: 36px; top: 13.6px; text-align: center; line-height: 1;
  transform: translateY(calc(-50% + var(--pt-dy))); font-family: var(--title-font); font-weight: 700; font-size: 13.7px; }

.saga .art { left: 125.6px; top: 38.7px; width: 109px; height: 262px; }
.saga .textbox { left: 15.4px; top: 38.7px; width: 109px; height: 262px; padding: 5px 4px; font-size: 9.6px; justify-content: flex-start; }

/* sideways cards: a 350x250 box turned a quarter turn inside the 250x350 card */
.turn { position: absolute; left: 0; top: 0; width: 350px; height: 250px; transform-origin: 0 0; transform: rotate(90deg) translate(0, -250px); }

.defense { position: absolute; right: 13px; bottom: 16px; width: 26px; height: 22px; color: #fff; font-family: var(--title-font); font-weight: 700;
  font-size: 12px; text-align: center; line-height: 22px; background: #1a1a1a; box-shadow: inset 0 0 0 0.9px #b9b9b9;
  clip-path: polygon(0 0, 100% 0, 100% 65%, 50% 100%, 0 65%); }
/* collector info: two rows on the left (number, then set/language/artist); the mint credit
   only on the bottom row, on the right, so it stays below the P/T box (which ends at 333) */
.footer { position: absolute; left: 16.5px; right: 17.5px; bottom: 10px; color: #fff;
  font-family: var(--body-font); font-size: 5.8px; line-height: 1.2; white-space: nowrap;
  display: flex; justify-content: space-between; align-items: baseline; letter-spacing: .02em; }
.footer.has-pt { align-items: last baseline; }  /* the P/T plate takes the top right, so the credit drops to the bottom line */
/* the collector block: a wide geometric sans in caps, as on the real cards; the artist in the title face as small caps */
.footer .collector { font-family: 'Montserrat', 'Liberation Sans', sans-serif; font-weight: 700; font-size: 5.7px; line-height: 1.25;
  letter-spacing: .1em; text-transform: uppercase; color: #fff; }
.footer .collector b { font-weight: 700; color: #fff; }
.footer .artist { font-family: var(--title-font); font-variant: small-caps; font-weight: 700; font-size: 6px;
  letter-spacing: .03em; text-transform: none; vertical-align: baseline; }
.footer .brush { width: 6.5px; height: 4px; margin: 0 1.3px 0 3.5px; vertical-align: baseline; }

<style>
/* the frame design (frame.DESIGNS): mint/designs/<name>.css moves the pieces above; the M15 frame adds nothing */
$design_css
</style>
<style>
/* per-set frame identity: sets/<code>.css, injected last so it can override any rule above */
$set_css
</style>
<!-- the card's classes: its layout; legendary; stamped and stamp-<kind>; a two-colour card's pair, and hybrid; design-<name>;
     rarity-<rarity>; kind-<frame kind: W U B R G gold artifact land C>, for a design with a palette of its own -->
<div class="card $layout$legendary$stamped$pair$design">
  <div class="frame"></div>
  $body
  $stamp
  $footer
</div>
<script>
// Shrink rules text until it fits its box; same trick the real frames use.
// Called by mint.py once the fonts have loaded -- measuring before that uses
// the fallback face's metrics and the real font then reflows wider.
window.fit = () => {
  // every text box (a split card has two) shrinks on its own; the smallest size is reported
  let fs = Infinity;
  for (const t of document.querySelectorAll('.textbox')) {
    t.style.fontSize = '';
    let f = parseFloat(getComputedStyle(t).fontSize);
    while (t.scrollHeight > t.clientHeight && f > 6) { f -= 0.2; t.style.fontSize = f + 'px'; }
    // the P/T plate (or a planeswalker's loyalty shield) overlaps the box's bottom right: the last line keeps
    // clear of it, as on the real cards
    const pt = document.querySelector('.pt, .loyalty');
    if (pt && t.id === 'text') {
      const pr = pt.getBoundingClientRect();
      const last = () => { const r = document.createRange(); r.selectNodeContents(t); const rs = r.getClientRects(); return rs[rs.length - 1]; };
      let lr = last();
      while (lr && lr.right > pr.left - 2 && lr.bottom > pr.top - 1 && f > 6) { f -= 0.2; t.style.fontSize = f + 'px'; lr = last(); }
    }
    // a lone single line of rules text, no flavour, sits centred
    if (t.id === 'text' && t.querySelectorAll('p').length === 1 && !t.querySelector('.flavor')) {
      const r = document.createRange(); r.selectNodeContents(t);
      if (r.getClientRects().length <= 2) t.classList.add('centred');
    }
    fs = Math.min(fs, f);
  }
  // long names shrink until name + cost fit the title bar, as on the real cards
  let ns = Infinity;
  for (const bar of document.querySelectorAll('.titlebar')) {
    const name = bar.querySelector('.name');
    name.style.fontSize = '';
    let n = parseFloat(getComputedStyle(name).fontSize);
    while (bar.scrollWidth > bar.clientWidth && n > 8) { n -= 0.2; name.style.fontSize = n + 'px'; }
    ns = Math.min(ns, n);
  }
  // long type lines shrink the same way, until type + expansion symbol fit the type bar. Without this the
  // symbol was the one that gave way -- it is the flexible half of the bar -- and a long line left a speck
  let ts = Infinity;
  for (const bar of document.querySelectorAll('.typebar')) {
    const type = bar.querySelector('.type');
    type.style.fontSize = '';
    let t = parseFloat(getComputedStyle(type).fontSize);
    while (bar.scrollWidth > bar.clientWidth && t > 7) { t -= 0.2; type.style.fontSize = t + 'px'; }
    ts = Math.min(ts, t);
  }
  return [fs, ns, ts];
};
</script>
